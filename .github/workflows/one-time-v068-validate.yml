name: One-time 0.6.8 auth and server validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v068-validate.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply auth/server reliability wiring
        shell: powershell
        run: '& .\scripts\one-time-v068-auth-server.ps1'
      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive
      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.7'
      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaReconnectDiagnostics.cs Tests/Vanilla.Diagnostics.Tests.csproj Tests/Program.cs
          git diff --cached --check
          git commit -m 'fix: detect login fields and server dialog before input'
          git push origin HEAD:main
