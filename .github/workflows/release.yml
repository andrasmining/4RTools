name: Verified release

on:
  push:
    branches: [main]
    paths:
      - 'Properties/AssemblyInfo.cs'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: verified-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Resolve release version
        shell: powershell
        run: |
          $text = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          $match = [regex]::Match($text, 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)\.0"\)')
          if (-not $match.Success) { throw 'Could not resolve semantic version from AssemblyFileVersion.' }
          "VERSION=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test, package and smoke-test Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version $env:VERSION'

      - name: Render and validate mock-data UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Upload UI screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ui-layout-${{ github.sha }}
          path: |
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $zip = "dist/4RTools-Vanilla-v$env:VERSION-portable.zip"
          $checksum = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing release ZIP: $zip" }
          if (-not (Test-Path -LiteralPath $checksum)) { throw "Missing release checksum: $checksum" }

          $previousPreference = $ErrorActionPreference
          $releaseExists = $false
          try {
            $ErrorActionPreference = 'Continue'
            & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
          }
          finally {
            $ErrorActionPreference = $previousPreference
          }

          if ($releaseExists) {
            & gh release upload $tag $zip $checksum --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to refresh assets for $tag." }
          }
          else {
            & gh release create $tag $zip $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "4RTools Vanilla $env:VERSION" --notes-file RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish $tag." }
          }

          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Published $tag"
          Write-Host "Portable ZIP SHA256: $sha"
