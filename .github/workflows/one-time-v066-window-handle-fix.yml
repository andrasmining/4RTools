name: One-time 0.6.6 launcher visible-window validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v066-window-handle-fix.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Route launcher input to the real visible Thor form
        shell: powershell
        run: |
          $utf8 = New-Object Text.UTF8Encoding($false)

          $path = 'Model/Vanilla/VanillaPatcherLauncher.cs'
          $text = Get-Content $path -Raw

          $old = '[DllImport("user32.dll")] private static extern bool EnumChildWindows(IntPtr parent, EnumWindowsProc callback, IntPtr lParam);'
          $new = '[DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);' + [Environment]::NewLine + '        [DllImport("user32.dll")] private static extern bool EnumChildWindows(IntPtr parent, EnumWindowsProc callback, IntPtr lParam);'
          if (-not $text.Contains($old)) { throw 'EnumChildWindows anchor missing.' }
          $text = $text.Replace($old, $new)

          $text = $text.Replace('                                IntPtr launcherHwnd = GetMainWindow(patcherPid.Value);', '                                IntPtr launcherHwnd = ResolveLauncherWindow(patcherPid.Value);' + [Environment]::NewLine + '                                if (launcherHwnd == IntPtr.Zero) throw new InvalidOperationException("No visible launcher top-level window was found for PID " + patcherPid.Value + ".");')
          $text = $text.Replace('                                    using (var input = new VanillaForegroundInput(patcherPid.Value))', '                                    using (var input = new VanillaForegroundInput(patcherPid.Value, launcherHwnd))')

          $text = $text.Replace('                    IntPtr hwnd = process.MainWindowHandle;', '                    IntPtr hwnd = ResolveLauncherWindow(processId);')
          $text = $text.Replace('            IntPtr main = GetMainWindow(processId);', '            IntPtr main = ResolveLauncherWindow(processId);')
          $text = $text.Replace('                        if (process.MainWindowHandle == IntPtr.Zero || !IsWindowVisible(process.MainWindowHandle)) continue;', '                        IntPtr resolvedWindow = ResolveLauncherWindow(process.Id);' + [Environment]::NewLine + '                        if (resolvedWindow == IntPtr.Zero || !IsWindowVisible(resolvedWindow)) continue;')
          $text = $text.Replace('                        rows.Add("PID=" + process.Id + " exited=" + process.HasExited + " hwnd=" + DescribeWindow(process.MainWindowHandle)', '                        rows.Add("PID=" + process.Id + " exited=" + process.HasExited + " processMain=" + DescribeWindow(process.MainWindowHandle)' + [Environment]::NewLine + '                            + " resolvedLauncher=" + DescribeWindow(ResolveLauncherWindow(process.Id))')

          $oldMethod = @'
        private static IntPtr GetMainWindow(int processId)
        {
            using (var process = Process.GetProcessById(processId))
            {
                process.Refresh();
                return process.MainWindowHandle;
            }
        }
'@
          $newMethod = @'
        private static IntPtr ResolveLauncherWindow(int processId)
        {
            IntPtr best = IntPtr.Zero;
            long bestScore = long.MinValue;
            EnumWindows((hwnd, state) =>
            {
                uint pid;
                GetWindowThreadProcessId(hwnd, out pid);
                if (pid != (uint)processId || !IsWindowVisible(hwnd)) return true;

                RECT rect;
                int width = 0, height = 0;
                if (GetClientRect(hwnd, out rect))
                {
                    width = Math.Max(0, rect.Right - rect.Left);
                    height = Math.Max(0, rect.Bottom - rect.Top);
                }

                string title = WindowTitle(hwnd);
                string cls = WindowClass(hwnd);
                long score = (long)width * height;
                if (title.IndexOf("Vanilla MMO Launcher", StringComparison.OrdinalIgnoreCase) >= 0) score += 1000000000L;
                if (cls.IndexOf("TThorForm", StringComparison.OrdinalIgnoreCase) >= 0) score += 500000000L;
                if (width < 100 || height < 100) score -= 100000000L;
                if (score > bestScore)
                {
                    best = hwnd;
                    bestScore = score;
                }
                return true;
            }, IntPtr.Zero);
            return best;
        }
'@
          if (-not $text.Contains($oldMethod)) { throw 'GetMainWindow method anchor missing.' }
          $text = $text.Replace($oldMethod, $newMethod)
          [IO.File]::WriteAllText($path, $text, $utf8)

          $path = 'Model/Vanilla/VanillaForegroundInput.cs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('        private readonly Process process;' + [Environment]::NewLine + '        private IntPtr window;', '        private readonly Process process;' + [Environment]::NewLine + '        private readonly IntPtr preferredWindow;' + [Environment]::NewLine + '        private IntPtr window;')
          $oldCtor = @'
        public VanillaForegroundInput(int processId)
        {
            process = Process.GetProcessById(processId);
            RefreshWindow();
        }
'@
          $newCtor = @'
        public VanillaForegroundInput(int processId) : this(processId, IntPtr.Zero) { }

        public VanillaForegroundInput(int processId, IntPtr preferredWindow)
        {
            process = Process.GetProcessById(processId);
            this.preferredWindow = preferredWindow;
            RefreshWindow();
        }
'@
          if (-not $text.Contains($oldCtor)) { throw 'VanillaForegroundInput constructor anchor missing.' }
          $text = $text.Replace($oldCtor, $newCtor)
          $oldRefresh = @'
            process.Refresh();
            window = process.MainWindowHandle;
            if (window == IntPtr.Zero || !IsWindow(window)) throw new InvalidOperationException("Vanilla client window is not ready.");
'@
          $newRefresh = @'
            process.Refresh();
            window = preferredWindow != IntPtr.Zero && IsWindow(preferredWindow) ? preferredWindow : process.MainWindowHandle;
            if (window == IntPtr.Zero || !IsWindow(window)) throw new InvalidOperationException("Vanilla client window is not ready.");
'@
          if (-not $text.Contains($oldRefresh)) { throw 'RefreshWindow anchor missing.' }
          $text = $text.Replace($oldRefresh, $newRefresh)
          [IO.File]::WriteAllText($path, $text, $utf8)

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.5'

      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaPatcherLauncher.cs Model/Vanilla/VanillaForegroundInput.cs
          git diff --cached --check
          git commit -m 'fix: target the visible Vanilla launcher form'
          git push origin HEAD:main
