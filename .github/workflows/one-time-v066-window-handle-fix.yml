name: One-time 0.6.6 launcher visible-window validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v066-window-handle-fix.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply visible launcher window fix
        shell: powershell
        run: '& .\scripts\one-time-v066-window-handle-fix.ps1'
      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive
      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.5'
      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaPatcherLauncher.cs Model/Vanilla/VanillaForegroundInput.cs
          git diff --cached --check
          git commit -m 'fix: target the visible Vanilla launcher form'
          git push origin HEAD:main
