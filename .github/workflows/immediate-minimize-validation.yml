name: Immediate minimize validation

on:
  push:
    branches: [fix/immediate-minimize-after-movement]
    paths:
      - '.github/workflows/immediate-minimize-validation.yml'
      - '.github/immediate-minimize-transform.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: immediate-minimize-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve source bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply reviewed minimize policy transformation
        shell: powershell
        run: |
          python .github/immediate-minimize-transform.py
          if ($LASTEXITCODE -ne 0) { throw 'Source transformation failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          git diff --stat

      - name: Restore dependencies
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate shipped profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1

      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease

      - name: Release build, tests, portable package and launch smoke
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.46

      - name: Native test-owned process recovery
        shell: powershell
        run: ./scripts/test-recovery-native.ps1

      - name: Native responsive UI checks
        shell: powershell
        run: ./scripts/test-ui-layout.ps1

      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name '4RTools engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaReconnectTestModes.cs Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaStartupOrchestrator.cs Model/Vanilla/VanillaAutobattleResume.cs Model/Vanilla/AGENTS.md Tests/VanillaRecoveryWatchdogTests.cs Properties/AssemblyInfo.cs RELEASE-NOTES.md
          git commit -m 'fix: minimize immediately after verified recovery movement'
          if ($LASTEXITCODE -ne 0) { throw 'Validated source commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; remote work was not overwritten.' }

      - name: Collect validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/evidence -Force | Out-Null
          git status --short | Out-File dist/evidence/worktree-status.txt -Encoding utf8
          git rev-parse HEAD | Out-File dist/evidence/source-commit.txt -Encoding utf8
          git diff origin/main...HEAD --stat | Out-File dist/evidence/change-stat.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immediate-minimize-validation-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/native-recovery.log
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/evidence/**
          retention-days: 7
          if-no-files-found: error
