name: One-time 0.6.9 final sequential recovery validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v069-validate.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final sequential recovery policy patch
        shell: powershell
        run: '& .\scripts\one-time-v069-policy-finalize.ps1'
      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive
      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.8'
      - name: Commit validated source and policy
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaReconnect.cs AGENTS.md
          git diff --cached --check
          git commit -m 'fix: finalize sequential reconnect recovery policy'
          git push origin HEAD:main
