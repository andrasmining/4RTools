name: One-time 0.6.10 Vanilla workspace polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v0610-polish.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply polish
        shell: powershell
        run: '& .\scripts\one-time-v0610-polish.ps1'
      - name: Restore
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive
      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.9'
      - name: Commit validated changes
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md Model/Vanilla/VanillaTemporaryActions.cs
          git diff --cached --check
          git commit -m 'fix: polish Vanilla-first workspace'
          git push origin HEAD:main
