name: One-time apply validated 0.6.10 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v0610-polish.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact patch that already passed build/test/package/smoke
        shell: powershell
        run: '& .\scripts\one-time-v0610-polish.ps1'
      - name: Commit and push with transient-error retry
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md Model/Vanilla/VanillaIntegratedShell.cs Model/Vanilla/VanillaTemporaryActions.cs Tests/Vanilla.Diagnostics.Tests.csproj Tests/Program.cs
          git diff --cached --check
          if (git diff --cached --quiet) {
            Write-Host 'Validated patch is already present.'
            exit 0
          }
          git commit -m 'fix: polish Vanilla-first workspace'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 5) { throw 'Validated patch could not be pushed after 5 attempts.' }
            Write-Host "Push attempt $attempt failed; retrying after 10 seconds."
            Start-Sleep -Seconds 10
          }
