name: Smart teleport validation

on:
  push:
    branches: [feat/per-character-smart-teleport]
    paths:
      - '.github/workflows/smart-teleport-validation.yml'
      - 'Forms/**'
      - 'Model/Vanilla/**'
      - 'Tests/**'
      - 'Properties/AssemblyInfo.cs'
      - 'README.md'
      - 'RELEASE-NOTES.md'
      - 'packaging/**'
      - 'AGENTS.md'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: smart-teleport-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Restore dependencies
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive
      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1
      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease
      - name: Release build, tests, package and smoke
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.49
      - name: Native recovery checks
        shell: powershell
        run: ./scripts/test-recovery-native.ps1
      - name: Responsive UI checks
        shell: powershell
        run: ./scripts/test-ui-layout.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smart-teleport-validation-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/native-recovery.log
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
          retention-days: 7
          if-no-files-found: warn
