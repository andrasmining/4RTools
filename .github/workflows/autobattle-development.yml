name: Autobattle final audit

on:
  push:
    branches: [fix/autobattle-movement-verification]
    paths: ['.github/workflows/autobattle-development.yml']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: autobattle-development
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve repository bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore dependencies
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }
      - name: Add targeted lifecycle regressions
        shell: powershell
        run: |
          python .github/final-audit.py tests
          if ($LASTEXITCODE -ne 0) { throw 'Regression insertion failed.' }
      - name: Reproduce the six old lifecycle failures
        shell: powershell
        run: |
          $failedAsExpected = $false
          $redCache = Join-Path $env:GITHUB_WORKSPACE 'dist/evidence/red'
          try { ./scripts/build.ps1 -Configuration Debug -VanillaRelease -CacheRoot $redCache }
          catch { $failedAsExpected = $true; Write-Host "Baseline regression result: $($_.Exception.Message)" }
          if (-not $failedAsExpected) { throw 'The added regressions did not reproduce the old bugs.' }
          $log = Get-ChildItem $redCache -Recurse -Filter tests-Debug.log | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { throw 'No runtime regression log: a compile failure is not an accepted reproduction.' }
          $text = Get-Content $log.FullName -Raw
          foreach ($name in @(
            'STOP cancels diagnostic completions',
            'Settings changes cancel diagnostic completions',
            'Rejected diagnostic requests keep the current generation',
            'Resume completion rejects a replaced PID',
            'Failed or interrupted startup cannot be adopted as healthy',
            'Successful explicit resume clears the failed latch')) {
            if (-not $text.Contains("FAIL $name")) { throw "Missing expected baseline failure: $name" }
          }
          if (-not $text.Contains('Autobattle resume: 41 passed; 6 failed.')) { throw 'Unexpected baseline regression result.' }
          'Six targeted runtime failures reproduced; baseline application and tests compiled.' | Out-File dist/evidence/red-regressions.txt -Encoding utf8
          $global:LASTEXITCODE = 0
      - name: Apply reviewed ownership and cancellation fixes
        shell: powershell
        run: |
          python .github/final-audit.py fix
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed integration failed.' }
          git add AGENTS.md Model/Vanilla/VanillaAutobattleResume.cs Model/Vanilla/VanillaForegroundInput.cs Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaReconnectDiagnostics.cs Model/Vanilla/VanillaStartupOrchestrator.cs Tests/VanillaAutobattleResumeTests.cs
          if ($LASTEXITCODE -ne 0) { throw 'Source staging failed.' }
          git -c core.whitespace=cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace validation failed.' }
          git diff --cached --stat
      - name: Validate shipped state profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1
      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease
      - name: Release build, tests, portable package and Windows launch smoke
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.35
      - name: Native Windows mock-data UI regression harness
        shell: powershell
        run: ./scripts/test-ui-layout.ps1
      - name: Commit validated source and remove temporary recovery infrastructure
        shell: powershell
        run: |
          git config user.name '4RTools engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/final-audit.py .github/workflows/autobattle-development.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary infrastructure cleanup failed.' }
          git commit -m 'fix: cancel stale recovery workers and preserve failed startup state'
          if ($LASTEXITCODE -ne 0) { throw 'Validated source commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Remote advanced; no overwrite attempted.' }
      - name: Collect source and validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/evidence -Force | Out-Null
          git bundle create dist/evidence/validated-source.bundle --all
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed.' }
          git status --short | Out-File dist/evidence/worktree-status.txt -Encoding utf8
          git rev-parse HEAD | Out-File dist/evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds', 'portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/evidence -Recurse -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobattle-final-audit-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/evidence/**
          retention-days: 7
          if-no-files-found: error
