name: Autobattle development recovery

on:
  push:
    branches: [fix/autobattle-movement-verification]
    paths: ['.github/workflows/autobattle-development.yml']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and branch history without credentials
        shell: powershell
        run: |
          git status --short
          git log -8 --oneline
          git bundle create "$env:RUNNER_TEMP/4RTools-review.bundle" --all
          if ($LASTEXITCODE -ne 0) { throw 'Repository export failed.' }
          git bundle verify "$env:RUNNER_TEMP/4RTools-review.bundle"
          if ($LASTEXITCODE -ne 0) { throw 'Repository export verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source-${{ github.run_id }}
          path: ${{ runner.temp }}/4RTools-review.bundle
          retention-days: 1
          if-no-files-found: error
