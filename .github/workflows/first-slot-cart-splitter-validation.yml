name: First-slot Cart and splitter validation

on:
  push:
    branches: [fix/cart-first-slot-and-log-splitter]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: first-slot-cart-splitter-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate first-slot and splitter source policy
        shell: powershell
        run: |
          $version = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          if ($version -notmatch 'AssemblyFileVersion\("0\.6\.56\.0"\)') { throw 'Expected 0.6.56 release version.' }
          $cart = Get-Content 'Model/Vanilla/VanillaWeightCartAutomation.cs' -Raw
          foreach ($required in @('ObserveFirstSlot','FirstSlotVerifySamples = 4','CartDropPoint','two fresh classified captures','safe detected Cart interior point')) {
            if ($cart -notmatch [regex]::Escape($required)) { throw "Missing first-slot Cart safeguard: $required" }
          }
          foreach ($forbidden in @('FirstEmptySlot(','SafeDropPoint','new Random(','System.Random','detected empty Cart slot')) {
            if ($cart -match [regex]::Escape($forbidden)) { throw "Forbidden obsolete/stochastic Cart path remains: $forbidden" }
          }
          $layout = Get-Content 'Model/Vanilla/VanillaResponsiveLayout.cs' -Raw
          foreach ($required in @('SplitContainer responsiveSplit','SplitterMoved','RememberRecoverySplit','responsiveWideSplitRatio')) {
            if ($layout -notmatch [regex]::Escape($required)) { throw "Missing draggable Recovery splitter behavior: $required" }
          }

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test, package and smoke-test Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.56'

      - name: Native test-owned process recovery checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate mock-data UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-slot-cart-splitter-${{ github.sha }}
          path: |
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
            dist/4RTools-Vanilla-v0.6.56-portable.zip
            dist/4RTools-Vanilla-v0.6.56-portable.zip.sha256
          if-no-files-found: warn
          retention-days: 7
