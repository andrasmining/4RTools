name: Username identity validation
on:
  push:
    branches: [fix/username-character-identity]
    paths: ['.github/workflows/username-validation.yml']
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: username-identity-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified username fix
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import base64, hashlib, lzma, re, subprocess
          assert subprocess.check_output(['git','branch','--show-current']).decode().strip() == 'fix/username-character-identity'
          text = ''.join(Path('.github/username-fix-%d.txt' % i).read_text().strip() for i in (1,2,3))
          assert len(text) == 24784, 'Incomplete source transfer'
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd36752b2a069afad5cb6563ca749e640c23152d262aab3cb82fe0f66c54e8257'
          paths = re.findall(r'^diff --git a/(\S+) b/\1$', patch.decode(), re.M)
          assert len(paths) == 22 and all(not p.startswith('.github/') for p in paths)
          evidence = Path('dist/evidence'); evidence.mkdir(parents=True, exist_ok=True)
          target = evidence / 'reviewed.patch'; target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--binary',str(target)],check=True)
          subprocess.run(['git','apply','--binary',str(target)],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--stat'],check=True)
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          subprocess.run(['git','archive','--format=zip','--output=dist/evidence/candidate-source.zip',tree],check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed source integration failed.' }
      - name: Restore dependencies
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }
      - name: Validate shipped profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1
      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease
      - name: Release build, tests, portable package and Windows launch
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.38
      - name: Native test-owned process recovery
        shell: powershell
        run: ./scripts/test-recovery-native.ps1
      - name: Native username diagnostics, legacy reconciliation and responsive UI
        shell: powershell
        run: ./scripts/test-ui-layout.ps1
      - name: Commit validated source and remove patch transport
        shell: powershell
        run: |
          git config user.name '4RTools engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/username-fix-1.txt .github/username-fix-2.txt .github/username-fix-3.txt
          if ($LASTEXITCODE -ne 0) { throw 'Transport cleanup failed.' }
          git commit -m 'fix: read verified username copies and reconcile composite character identities'
          if ($LASTEXITCODE -ne 0) { throw 'Validated source commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; no remote changes were overwritten.' }
      - name: Collect source and validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/evidence -Force | Out-Null
          git bundle create dist/evidence/source.bundle --all
          if ($LASTEXITCODE -ne 0) { throw 'Source evidence export failed.' }
          git status --short | Out-File dist/evidence/worktree-status.txt -Encoding utf8
          git rev-parse HEAD | Out-File dist/evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds','portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/evidence -Recurse -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: username-validation-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/native-recovery.log
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/evidence/**
          retention-days: 7
          if-no-files-found: error
