name: One-time 0.6.5 unique client assignment validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v065-compile-fix.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prevent duplicate PID assignment across configured accounts
        shell: powershell
        run: |
          $path = 'Model/Vanilla/VanillaReconnect.cs'
          $text = Get-Content $path -Raw
          $oldPreserve = '                    if (runtime.ProcessId.HasValue && aliveIds.Contains(runtime.ProcessId.Value))'
          $newPreserve = '                    if (runtime.ProcessId.HasValue && aliveIds.Contains(runtime.ProcessId.Value) && !claimed.Contains(runtime.ProcessId.Value))'
          if (-not $text.Contains($oldPreserve)) { throw 'Expected existing-client ownership check was not found.' }
          $text = $text.Replace($oldPreserve, $newPreserve)
          $oldMissing = '                    if (match == null) continue;'
          $newMissing = '                    if (match == null)' + [Environment]::NewLine + '                    {' + [Environment]::NewLine + '                        runtime.ProcessId = null;' + [Environment]::NewLine + '                        runtime.ResumeSent = false;' + [Environment]::NewLine + '                        continue;' + [Environment]::NewLine + '                    }'
          if (-not $text.Contains($oldMissing)) { throw 'Expected no-match branch was not found.' }
          $text = $text.Replace($oldMissing, $newMissing)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.4'

      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaReconnect.cs
          git diff --cached --check
          git commit -m 'fix: keep configured clients uniquely assigned'
          git push origin HEAD:main
