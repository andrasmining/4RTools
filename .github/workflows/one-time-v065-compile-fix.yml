name: One-time 0.6.5 launcher diagnostics compile fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v065-compile-fix.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix native GAME START child-control scan
        shell: powershell
        run: |
          $path = 'Model/Vanilla/VanillaPatcherLauncher.cs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('            control = IntPtr.Zero;' + [Environment]::NewLine + '            var rows = new List<string>();', '            IntPtr found = IntPtr.Zero;' + [Environment]::NewLine + '            var rows = new List<string>();')
          $text = $text.Replace('            if (root == IntPtr.Zero) { inventory = "root=none"; return false; }', '            if (root == IntPtr.Zero) { control = IntPtr.Zero; inventory = "root=none"; return false; }')
          $text = $text.Replace('                if (control == IntPtr.Zero && title.IndexOf("GAME START", StringComparison.OrdinalIgnoreCase) >= 0)', '                if (found == IntPtr.Zero && title.IndexOf("GAME START", StringComparison.OrdinalIgnoreCase) >= 0)')
          $text = $text.Replace('                    control = hwnd;', '                    found = hwnd;')
          $text = $text.Replace('            inventory = rows.Count == 0 ? "none" : string.Join(" | ", rows);' + [Environment]::NewLine + '            return control != IntPtr.Zero;', '            control = found;' + [Environment]::NewLine + '            inventory = rows.Count == 0 ? "none" : string.Join(" | ", rows);' + [Environment]::NewLine + '            return found != IntPtr.Zero;')
          if ($text -notmatch 'IntPtr found = IntPtr.Zero;') { throw 'Native GAME START scan was not updated.' }
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Build, test, package and smoke-test
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.4'

      - name: Commit validated source
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaPatcherLauncher.cs
          git diff --cached --check
          git commit -m 'fix: compile launcher child-control diagnostics'
          git push origin HEAD:main
