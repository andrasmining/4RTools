name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Build and test release
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Release -VanillaRelease'

      - name: Build portable release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.3.0'

      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: 4RTools-Vanilla-0.3.0-portable
          path: |
            dist/4RTools-Vanilla-v0.3.0-portable.zip
            dist/4RTools-Vanilla-v0.3.0-portable.zip.sha256
          if-no-files-found: error
          retention-days: 30
