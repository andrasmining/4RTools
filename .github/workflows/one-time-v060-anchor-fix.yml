name: One-time 0.6.0 login anchor fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v060-anchor-fix.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply verified login anchor fix
        shell: powershell
        run: '& .\scripts\one-time-v060-login-anchor-fix.ps1'

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Validate build, tests and portable package
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.0'

      - name: Commit fix and remove one-time files
        shell: powershell
        run: |
          Remove-Item '.github/workflows/one-time-v060-anchor-fix.yml','scripts/one-time-v060-login-anchor-fix.ps1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: target Vanilla login fields precisely'
          git push origin HEAD:main
