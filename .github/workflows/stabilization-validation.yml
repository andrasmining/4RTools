name: Stabilization validation

on:
  push:
    branches: [fix/repo-stabilization-review]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stabilization-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate stabilization source policy
        shell: powershell
        run: |
          $version = Get-Content 'Properties/AssemblyInfo.cs' -Raw
          if ($version -notmatch 'AssemblyFileVersion\("0\.6\.50\.0"\)') { throw 'Expected 0.6.50 release version.' }
          $packages = Get-Content 'packages.config' -Raw
          if ($packages -match 'System\.Net\.Http" version="4\.3\.0"' -or
              $packages -match 'System\.Text\.RegularExpressions" version="4\.3\.0"') {
            throw 'Vulnerable package version remains.'
          }
          $shell = Get-Content 'Model/Vanilla/VanillaIntegratedShell.cs' -Raw
          if ($shell -match 'WorkspacePage\("Automation"\)' -or $shell -match 'vanillaRulesPage') {
            throw 'Retired Vanilla Automation tab remains.'
          }
          $reconnect = Get-Content 'Model/Vanilla/VanillaReconnect.cs' -Raw
          if ($reconnect -notmatch 'MovementRestartSeconds.*180') {
            throw 'Three-minute no-movement restart default is missing.'
          }

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: '& .\scripts\validate-vanilla-build-profiles.ps1'

      - name: Build and test Debug
        shell: powershell
        run: '& .\scripts\build.ps1 -Configuration Debug -VanillaRelease'

      - name: Build, test, package and smoke-test Release
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.6.50'

      - name: Native test-owned process recovery checks
        shell: powershell
        run: '& .\scripts\test-recovery-native.ps1'

      - name: Render and validate mock-data UI
        shell: powershell
        run: '& .\scripts\test-ui-layout.ps1'

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-validation-${{ github.sha }}
          path: |
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/native-recovery.log
            dist/4RTools-Vanilla-v0.6.50-portable.zip
            dist/4RTools-Vanilla-v0.6.50-portable.zip.sha256
          if-no-files-found: warn
          retention-days: 7
