name: One-time reconnect hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-reconnect-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Harden reconnect state handling
        shell: powershell
        run: |
          $path = 'Model/Vanilla/VanillaReconnect.cs'
          $text = [IO.File]::ReadAllText($path)
          $replacements = @(
            @('if (nx >= .30 && nx <= .70 && ny >= .43 && ny <= .70)', 'if (nx >= .30 && nx <= .70 && ny >= .40 && ny <= .68)'),
            @('if (lum >= 175 && lum <= 248 && max - min <= 38) centerNeutralLight++;', 'if (lum >= 175 && max - min <= 50) centerNeutralLight++;'),
            @('if (modal >= .42 && brightRatio < .55 && hudDark >= .16) return VanillaVisualState.ModalDialog;', 'if (modal >= .25 && brightRatio < .55 && hudDark >= .16) return VanillaVisualState.ModalDialog;'),
            @('QueueLogin(runtime, false, "Login shell detected after disconnect");', 'QueueLogin(runtime, runtime.LastLaunch.HasValue && (!runtime.LastRecovery.HasValue || runtime.LastLaunch.Value > runtime.LastRecovery.Value), "Login shell detected after disconnect");')
          )
          foreach ($pair in $replacements) {
            if (-not $text.Contains($pair[0])) { throw "Expected reconnect source fragment not found: $($pair[0])" }
            $text = $text.Replace($pair[0], $pair[1])
          }

          $bindPattern = '(?s)(private void Bind\(Runtime runtime, int pid, bool freshLaunch, string detail\)\s*\{\s*runtime\.ProcessId = pid;\s*)runtime\.ResumeSent = false;'
          $bindRegex = [regex]::new($bindPattern)
          if (-not $bindRegex.IsMatch($text)) { throw 'Bind method resume assignment was not found.' }
          $text = $bindRegex.Replace($text, { param($m) $m.Groups[1].Value + '// Never toggle Autobattle merely because 4RTools adopted an already-running client.' + [Environment]::NewLine + '            // A fresh launch or a relog sequence explicitly arms the one-shot resume hotkey.' + [Environment]::NewLine + '            runtime.ResumeSent = !freshLaunch;' }, 1)

          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          Remove-Item '.github/workflows/one-time-reconnect-hardening.yml'
      - name: Commit hardening and remove one-time workflow
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Model/Vanilla/VanillaReconnect.cs .github/workflows/one-time-reconnect-hardening.yml
          git commit -m 'fix: harden Vanilla reconnect recovery'
          git push origin HEAD:main
