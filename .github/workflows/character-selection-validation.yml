name: Character selection validation
on:
  push:
    branches: [fix/agnostic-character-selection]
    paths: ['.github/workflows/character-selection-validation.yml']
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: character-selection-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Preserve source bytes
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed character-selection fix
        shell: powershell
        run: |
          python .github/character-selection-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Character-selection patch failed.' }
          git -c core.whitespace=cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
          if (git grep -n -E 'ClickNormalized\(config\.Anchors\.(CharacterGrid|GameStart)' -- Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaStartupOrchestrator.cs) {
            throw 'Fixed character-selection coordinate click remains in production path.'
          }
      - name: Restore dependencies
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }
      - name: Validate shipped profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1
      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease
      - name: Release build, tests, portable package and Windows launch
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.39
      - name: Native test-owned process recovery
        shell: powershell
        run: ./scripts/test-recovery-native.ps1
      - name: Native responsive UI regression checks
        shell: powershell
        run: ./scripts/test-ui-layout.ps1
      - name: Commit validated source and remove temporary validation transport
        shell: powershell
        run: |
          git config user.name '4RTools engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md Model/Vanilla/VanillaReconnect.cs Model/Vanilla/VanillaStartupOrchestrator.cs Properties/AssemblyInfo.cs README.md RELEASE-NOTES.md packaging/README.txt Tests/VanillaReconnectRegressionTests.cs
          git rm .github/character-selection-fix.py .github/workflows/character-selection-validation.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary validation cleanup failed.' }
          git commit -m 'fix: select configured characters without coordinate clicks'
          if ($LASTEXITCODE -ne 0) { throw 'Validated source commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; no remote work was overwritten.' }
      - name: Collect validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/evidence -Force | Out-Null
          git bundle create dist/evidence/source.bundle --all
          if ($LASTEXITCODE -ne 0) { throw 'Source evidence export failed.' }
          git status --short | Out-File dist/evidence/worktree-status.txt -Encoding utf8
          git rev-parse HEAD | Out-File dist/evidence/source-commit.txt -Encoding utf8
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds','portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/evidence -Recurse -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-selection-validation-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/native-recovery.log
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/evidence/**
          retention-days: 7
          if-no-files-found: error
