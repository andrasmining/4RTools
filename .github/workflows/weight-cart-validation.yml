name: Weight cart validation

on:
  push:
    branches: [feat/weight-cart-management]
    paths: ['.github/workflows/weight-cart-validation.yml']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: weight-cart-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Preserve source bytes
        shell: powershell
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply checksum-verified reviewed weight cart patch
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import base64, hashlib, lzma, re, subprocess
          data = ''.join(Path('.github/weight-cart-patch-%d.txt' % i).read_text().strip() for i in range(1,5))
          assert len(data) == 31528, 'Incomplete patch transport: %d' % len(data)
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '548f9ee09e1ee189091b78210ff75e7f9fd851d1e39bd95e9543cd65c3faa035', digest
          paths = re.findall(r'^diff --git a/(\S+) b/\1$', patch.decode('utf-8'), re.M)
          assert len(paths) == 14, paths
          assert all(not p.startswith('.github/') for p in paths)
          evidence = Path('dist/evidence'); evidence.mkdir(parents=True, exist_ok=True)
          target = evidence / 'reviewed-weight-cart.patch'; target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--binary',str(target)], check=True)
          subprocess.run(['git','apply','--binary',str(target)], check=True)
          source = Path('Model/Vanilla/VanillaWeightAlerts.cs')
          text = source.read_text()
          assert 'private Timer timer;' in text and 'timer = new Timer(_ => Poll()' in text
          text = text.replace('private Timer timer;', 'private System.Threading.Timer timer;')
          text = text.replace('timer = new Timer(_ => Poll()', 'timer = new System.Threading.Timer(_ => Poll()')
          source.write_text(text)
          subprocess.run(['git','add','--',*paths], check=True)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'], check=True)
          subprocess.run(['git','diff','--cached','--stat'], check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed patch integration failed.' }

      - name: Restore dependencies
        shell: powershell
        run: |
          nuget restore 4RTools.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Validate shipped Vanilla build profiles
        shell: powershell
        run: ./scripts/validate-vanilla-build-profiles.ps1

      - name: Debug build and complete regression suite
        shell: powershell
        run: ./scripts/build.ps1 -Configuration Debug -VanillaRelease

      - name: Release build, tests, portable package and launch smoke
        shell: powershell
        run: ./scripts/build-release.ps1 -Version 0.6.47

      - name: Native process recovery checks
        shell: powershell
        run: ./scripts/test-recovery-native.ps1

      - name: Native UI layout and weight-cart settings checks
        shell: powershell
        run: ./scripts/test-ui-layout.ps1

      - name: Commit validated product source and remove patch transport
        shell: powershell
        run: |
          git config user.name '4RTools engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/weight-cart-patch-1.txt .github/weight-cart-patch-2.txt .github/weight-cart-patch-3.txt .github/weight-cart-patch-4.txt
          if ($LASTEXITCODE -ne 0) { throw 'Patch transport cleanup failed.' }
          git commit -m 'feat: add UI-only weight cart management'
          if ($LASTEXITCODE -ne 0) { throw 'Validated source commit failed.' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; remote work was not overwritten.' }

      - name: Collect validation evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/evidence -Force | Out-Null
          git status --short | Out-File dist/evidence/worktree-status.txt -Encoding utf8
          git rev-parse HEAD | Out-File dist/evidence/source-commit.txt -Encoding utf8
          git bundle create dist/evidence/source.bundle --all
          $cache = Join-Path $env:LOCALAPPDATA '4RTools-Engineering'
          foreach ($folder in @('builds','portable-tests')) {
            $source = Join-Path $cache $folder
            if (Test-Path $source) { Copy-Item $source dist/evidence -Recurse -Force }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weight-cart-validation-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/native-recovery.log
            dist/ui-layout/*.png
            dist/ui-layout/*.txt
            dist/evidence/**
          retention-days: 7
          if-no-files-found: error
