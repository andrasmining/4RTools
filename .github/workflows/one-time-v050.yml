name: One-time 0.5.0 recovery UX migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v050.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair migration script syntax
        shell: powershell
        run: |
          $path = 'scripts/one-time-v050.ps1'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('in $Path: $Old', 'in ${Path}: $Old')
          $text = $text.Replace('in $Path, found', 'in ${Path}, found')
          $text = $text.Replace('\n', '\r?\n')
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Apply 0.5.0 migration
        shell: powershell
        run: '& .\scripts\one-time-v050.ps1'

      - name: Make Vanilla a designer-owned first tab
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object Text.UTF8Encoding($false)
          $nl = [Environment]::NewLine

          $designerPath = 'Forms/Container.Designer.cs'
          $designer = [IO.File]::ReadAllText($designerPath)

          $anchor = '            this.atkDefMode = new System.Windows.Forms.TabControl();'
          if (-not $designer.Contains($anchor)) { throw 'atkDefMode construction anchor missing.' }
          $designer = $designer.Replace($anchor, $anchor + $nl + '            this.tabPageVanilla = new System.Windows.Forms.TabPage();')

          $anchor = '            this.atkDefMode.Controls.Add(this.tabPageSpammer);'
          if (-not $designer.Contains($anchor)) { throw 'atkDefMode first-tab anchor missing.' }
          $designer = $designer.Replace($anchor, '            this.atkDefMode.Controls.Add(this.tabPageVanilla);' + $nl + $anchor)

          $anchor = '            // tabDebuffRecovery'
          if (-not $designer.Contains($anchor)) { throw 'Vanilla tab initialization anchor missing.' }
          $vanillaBlock = @(
            '            // ',
            '            // tabPageVanilla',
            '            // ',
            '            this.tabPageVanilla.Location = new System.Drawing.Point(4, 22);',
            '            this.tabPageVanilla.Name = "tabPageVanilla";',
            '            this.tabPageVanilla.Padding = new System.Windows.Forms.Padding(3);',
            '            this.tabPageVanilla.Size = new System.Drawing.Size(865, 274);',
            '            this.tabPageVanilla.TabIndex = 0;',
            '            this.tabPageVanilla.Text = "Vanilla";',
            '            this.tabPageVanilla.UseVisualStyleBackColor = true;',
            '            // '
          ) -join $nl
          $designer = $designer.Replace($anchor, $vanillaBlock + $nl + $anchor)

          $anchor = '        private TabControl atkDefMode;'
          if (-not $designer.Contains($anchor)) { throw 'atkDefMode field anchor missing.' }
          $designer = $designer.Replace($anchor, $anchor + $nl + '        private TabPage tabPageVanilla;')
          [IO.File]::WriteAllText($designerPath, $designer, $utf8)

          $containerPath = 'Forms/Container.cs'
          $container = [IO.File]::ReadAllText($containerPath)
          $old = '            var page = new TabPage("Vanilla") { Name = "tabPageVanilla" };'
          $new = '            var page = tabPageVanilla;' + $nl + '            page.Controls.Clear();'
          if (-not $container.Contains($old)) { throw 'Generated dynamic Vanilla tab creation was not found.' }
          $container = $container.Replace($old, $new)

          $old = '            atkDefMode.TabPages.Insert(0, page);'
          if (-not $container.Contains($old)) { throw 'Generated dynamic Vanilla tab insertion was not found.' }
          $container = $container.Replace($old + $nl, '')
          $container = $container.Replace($old, '')

          $selectionVariants = @(
            'if (client.IsVanilla && atkDefMode.TabPages.ContainsKey("tabPageVanilla")) atkDefMode.SelectedTab = atkDefMode.TabPages["tabPageVanilla"];',
            'if (client.IsVanilla) atkDefMode.SelectedTab = atkDefMode.TabPages.Cast<TabPage>().FirstOrDefault(page => page.Text == "Vanilla") ?? atkDefMode.SelectedTab;'
          )
          $replacedSelection = $false
          foreach ($variant in $selectionVariants) {
            if ($container.Contains($variant)) {
              $container = $container.Replace($variant, 'if (client.IsVanilla) atkDefMode.SelectedTab = tabPageVanilla;')
              $replacedSelection = $true
            }
          }
          if (-not $replacedSelection) { throw 'Vanilla client tab-selection statement was not found.' }

          $validationSelection = 'atkDefMode.SelectedTab = atkDefMode.TabPages[atkDefMode.TabPages.Count - 1];'
          if ($container.Contains($validationSelection)) {
            $container = $container.Replace($validationSelection, 'atkDefMode.SelectedTab = tabPageVanilla;')
          }

          $snapshotAnchor = '        internal VanillaClientState VanillaSnapshot { get { return vanillaSession.Snapshot; } }'
          if (-not $container.Contains($snapshotAnchor)) { throw 'Container smoke-property anchor missing.' }
          $addition = $snapshotAnchor + $nl + '        internal bool VanillaTabIsFirst { get { return atkDefMode.TabPages.Count > 0 && object.ReferenceEquals(atkDefMode.TabPages[0], tabPageVanilla); } }' + $nl + '        internal string PrimaryTabOrder { get { return string.Join(" | ", atkDefMode.TabPages.Cast<TabPage>().Select(page => page.Text)); } }'
          $container = $container.Replace($snapshotAnchor, $addition)
          [IO.File]::WriteAllText($containerPath, $container, $utf8)

          $programPath = 'Program.cs'
          $program = [IO.File]::ReadAllText($programPath)
          $oldCondition = 'if (mainTabs == null || mainTabs.TabPages.Count == 0 || mainTabs.TabPages[0].Text != "Vanilla")'
          if (-not $program.Contains($oldCondition)) { throw 'Generated primary-tab smoke condition missing.' }
          $program = $program.Replace($oldCondition, 'if (!form.VanillaTabIsFirst)')
          $program = $program.Replace('throw new InvalidOperationException("Vanilla must be the first primary feature tab.");', 'throw new InvalidOperationException("Vanilla must be the first primary feature tab. Actual order: " + form.PrimaryTabOrder);')
          [IO.File]::WriteAllText($programPath, $program, $utf8)

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Validate 0.5.0 build, tests and portable package
        shell: powershell
        run: |
          try {
            & .\scripts\build-release.ps1 -Version 0.5.0
          }
          catch {
            Write-Host '--- portable smoke evidence ---'
            $root = Join-Path $env:LOCALAPPDATA '4RTools-Engineering\portable-tests'
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter 'portable-smoke.json' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 |
                ForEach-Object { Get-Content $_.FullName -Raw }
            }
            throw
          }

      - name: Commit migration and remove one-time files
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: improve Vanilla recovery UX and tests'
          git push origin HEAD:main
