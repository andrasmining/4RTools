name: One-time 0.5.0 recovery UX migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v050.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair migration script syntax
        shell: powershell
        run: |
          $path = 'scripts/one-time-v050.ps1'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('in $Path: $Old', 'in ${Path}: $Old')
          $text = $text.Replace('in $Path, found', 'in ${Path}, found')
          $text = $text.Replace('\n', '\r?\n')
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Apply 0.5.0 migration
        shell: powershell
        run: '& .\scripts\one-time-v050.ps1'

      - name: Make primary-tab smoke validation explicit
        shell: powershell
        run: |
          $utf8 = New-Object Text.UTF8Encoding($false)

          $containerPath = 'Forms/Container.cs'
          $container = [IO.File]::ReadAllText($containerPath)
          $anchor = '        internal VanillaClientState VanillaSnapshot { get { return vanillaSession.Snapshot; } }'
          $addition = $anchor + [Environment]::NewLine + '        internal bool VanillaTabIsFirst { get { return atkDefMode.TabPages.Count > 0 && atkDefMode.TabPages[0].Text == "Vanilla"; } }' + [Environment]::NewLine + '        internal string PrimaryTabOrder { get { return string.Join(" | ", atkDefMode.TabPages.Cast<TabPage>().Select(page => page.Text)); } }'
          if (-not $container.Contains($anchor)) { throw 'Container smoke-property anchor was not found.' }
          $container = $container.Replace($anchor, $addition)
          $nameSelection = 'if (client.IsVanilla && atkDefMode.TabPages.ContainsKey("tabPageVanilla")) atkDefMode.SelectedTab = atkDefMode.TabPages["tabPageVanilla"];'
          $textSelection = 'if (client.IsVanilla) atkDefMode.SelectedTab = atkDefMode.TabPages.Cast<TabPage>().FirstOrDefault(page => page.Text == "Vanilla") ?? atkDefMode.SelectedTab;'
          if ($container.Contains($nameSelection)) { $container = $container.Replace($nameSelection, $textSelection) }
          [IO.File]::WriteAllText($containerPath, $container, $utf8)

          $programPath = 'Program.cs'
          $program = [IO.File]::ReadAllText($programPath)
          $old = 'if (mainTabs == null || mainTabs.TabPages.Count == 0 || mainTabs.TabPages[0].Text != "Vanilla")'
          $new = 'if (!form.VanillaTabIsFirst)'
          if (-not $program.Contains($old)) { throw 'Generated primary-tab smoke condition was not found.' }
          $program = $program.Replace($old, $new)
          $program = $program.Replace('throw new InvalidOperationException("Vanilla must be the first primary feature tab.");', 'throw new InvalidOperationException("Vanilla must be the first primary feature tab. Actual order: " + form.PrimaryTabOrder);')
          [IO.File]::WriteAllText($programPath, $program, $utf8)

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Validate 0.5.0 build, tests and portable package
        shell: powershell
        run: |
          try {
            & .\scripts\build-release.ps1 -Version 0.5.0
          }
          catch {
            Write-Host '--- portable smoke evidence ---'
            $root = Join-Path $env:LOCALAPPDATA '4RTools-Engineering\portable-tests'
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter 'portable-smoke.json' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 |
                ForEach-Object { Get-Content $_.FullName -Raw }
            }
            throw
          }

      - name: Commit migration and remove one-time files
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: improve Vanilla recovery UX and tests'
          git push origin HEAD:main
