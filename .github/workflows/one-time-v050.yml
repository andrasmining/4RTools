name: One-time 0.5.0 recovery UX migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v050.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repair migration script syntax
        shell: powershell
        run: |
          $path = 'scripts/one-time-v050.ps1'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace('in $Path: $Old', 'in ${Path}: $Old')
          $text = $text.Replace('in $Path, found', 'in ${Path}, found')
          $text = $text.Replace('\n', '\r?\n')
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Apply 0.5.0 migration
        shell: powershell
        run: '& .\scripts\one-time-v050.ps1'

      - name: Fix primary-tab smoke selector
        shell: powershell
        run: |
          $path = 'Program.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
                    var mainTabs = Descendants(form).OfType<System.Windows.Forms.TabControl>()
                        .OrderByDescending(tabs => tabs.TabPages.Count).FirstOrDefault();
'@
          $new = @'
                    var mainTabs = Descendants(form).OfType<System.Windows.Forms.TabControl>()
                        .FirstOrDefault(tabs => tabs.Name == "atkDefMode");
'@
          if (-not $text.Contains($old.TrimStart("`r", "`n"))) {
            $old = $old.Replace("`r`n", "`n")
            $new = $new.Replace("`r`n", "`n")
          }
          $old = $old.TrimStart("`r", "`n")
          $new = $new.TrimStart("`r", "`n")
          if (-not $text.Contains($old)) { throw 'Generated primary-tab smoke selector was not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Validate 0.5.0 build, tests and portable package
        shell: powershell
        run: |
          try {
            & .\scripts\build-release.ps1 -Version 0.5.0
          }
          catch {
            Write-Host '--- portable smoke evidence ---'
            $root = Join-Path $env:LOCALAPPDATA '4RTools-Engineering\portable-tests'
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter 'portable-smoke.json' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1 |
                ForEach-Object { Get-Content $_.FullName -Raw }
            }
            throw
          }

      - name: Commit migration and remove one-time files
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: improve Vanilla recovery UX and tests'
          git push origin HEAD:main
