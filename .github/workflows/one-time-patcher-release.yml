name: One-time patcher startup migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-patcher-release.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply patcher startup integration
        shell: powershell
        run: '& .\scripts\one-time-patcher-release.ps1'

      - name: Restore NuGet packages
        shell: powershell
        run: nuget restore 4RTools.sln -NonInteractive

      - name: Validate 0.4.0 build, tests and portable package
        shell: powershell
        run: '& .\scripts\build-release.ps1 -Version 0.4.0'

      - name: Commit migration and remove one-time files
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: add patcher startup and publish 0.4.0'
          git push origin HEAD:main
